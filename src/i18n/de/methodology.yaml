sections:
  - id: who
    h: Wer diese Website betreibt
    p:
      - Dieser Vergleich wird von Plugixa gepflegt, dem Unternehmen hinter Plugixa Inventory, einem der verglichenen Plugins. Das ist ein Interessenkonflikt, und diese Seite erklärt, wie wir damit umgehen.
      - Jede Seite trägt einen Hinweis darauf, wer die Website pflegt. Unser Plugin ist in den Tabellen gekennzeichnet. In einer Rangfolge steht es nur dort an erster Stelle, wo die geprüften Daten das stützen, und seine Seite nennt seine Schwächen auf dieselbe Weise wie die Seite jedes anderen Plugins.
  - id: sources
    h: Woher die Werte stammen
    p:
      - Bei den Plugins der Mitbewerber stammt jeder Wert aus dem eigenen Material des Anbieters, also aus dem Eintrag auf wordpress.org, den Funktions- und Dokumentationsseiten und der Preisseite, und in vielen Fällen aus dem Code des kostenlosen Plugins auf wordpress.org. Jeder geprüfte Wert in einer Tabelle verlinkt auf die Seite, der er entnommen wurde.
      - "Bei Plugixa Inventory stammen die Werte aus dem Quellcode des Plugins. Kostenlose Funktionen verlinken auf diesen Code auf wordpress.org, Pro-Funktionen auf den Eintrag auf wordpress.org, der sie nennt. Wir haben dieselben Definitionen angewendet. Deshalb ist es bei Bestellungen, Kundenaufträgen und WooCommerce mit „Nein“ gekennzeichnet."
      - Installationszahlen, Bewertungen, Versionsnummern und Aktualisierungsdaten liest ein Skript aus der öffentlichen Plugin-API von wordpress.org aus. Sie werden nicht von Hand eingetippt.
  - id: labels
    h: Was die Kennzeichnungen bedeuten
    p:
      - "„Ja“ bedeutet, dass das Plugin leistet, was die Definition der Funktion beschreibt. „Teilweise“ bedeutet, dass es einen Teil davon leistet, und eine Anmerkung nennt, was fehlt. „Nein“ bedeutet, dass es das nicht kann. „Nicht geprüft“ bedeutet, dass wir den Wert anhand der Seiten oder des Codes des Anbieters nicht bestätigen konnten und deshalb keine Aussage treffen."
      - "„Kostenlos“ bedeutet, dass die Funktion in der kostenlosen Version enthalten ist. „Kostenpflichtig“ nennt den günstigsten Tarif, der sie enthält, und „Kostenpflichtiges Add-on“ bedeutet, dass sie als separate Erweiterung verkauft wird, soweit der Anbieter das angibt."
      - "„Nicht geprüft“ ist kein höfliches „Nein“. Viele dieser Funktionen gibt es wahrscheinlich. Wir lassen lieber eine Lücke, als zu raten."
  - id: kinds
    h: Drei Arten von Lagerverwaltungs-Plugins
    p:
      - "„Lagerverwaltung“ umfasst unterschiedliche Produkte. Ein eigenständiges Lagerverwaltungs-Plugin führt eigene Datensätze zu Artikeln, Lagerorten und Lagerbewegungen, mit oder ohne Shop. Ein Bestands-Add-on für WooCommerce arbeitet mit dem Bestand von Shop-Produkten und setzt WooCommerce voraus. Eine ERP- oder Buchhaltungs-Suite hat die Lagerverwaltung als ein Modul unter vielen."
      - "Jedes Plugin ist mit seiner Art gekennzeichnet, denn ein „Nein“ in der Zeile WooCommerce sagt bei einem eigenständigen Plugin wenig aus, und fehlende Unterstützung für mehrere Lager sagt wenig aus für einen Shop mit einem einzigen Lager."
  - id: limits
    h: Was wir nicht getan haben
    p:
      - Wir haben nicht jedes Plugin installiert und von Hand getestet, und wir haben keine Geschwindigkeitstests durchgeführt. Die Werte geben wieder, was die Anbieter über ihre eigenen Produkte sagen und was ihr kostenloser Code zeigt.
      - Es gibt von uns keine Gesamtnote und keine Sternebewertung. Die gezeigten Bewertungen sind die öffentlichen Bewertungen auf wordpress.org, mit der Anzahl der Bewertungen daneben.
      - Die Preise sind die am Tag unserer Prüfung angezeigten. Wo ein Anbieter einen Aktionspreis zeigte, nennen wir auch den regulären Preis. WP ERP wird pro Nutzer berechnet; wir zeigen den Preis des Jahrestarifs.
  - id: rankings
    h: Wie Rangfolgen und Empfehlungen entstehen
    p:
      - Bestenlisten ordnen Plugins für einen genannten Bedarf. Jede Empfehlung hat eine Begründung, die sich anhand der Funktionstabelle prüfen lässt.
      - Wir betrachten den Umfang der kostenlosen Version, den Preis pro Website, wie kürzlich das Plugin aktualisiert wurde sowie seine öffentliche Bewertung und Installationszahl.
  - id: corrections
    h: Korrekturen
    p:
      - Wenn ein Wert falsch oder veraltet ist, eröffnen Sie ein Issue im GitHub-Repository, mit einem Link zur Seite des Anbieters, die den richtigen Wert zeigt. Anbieter sind eingeladen, das für ihre eigenen Plugins zu tun.
      - Daten und Texte stehen unter CC BY 4.0, Sie dürfen sie also mit Namensnennung weiterverwenden.
