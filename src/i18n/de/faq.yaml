items:
  - q: Welches ist das beste WordPress-Plugin für die Lagerverwaltung?
    a: Das hängt davon ab, wo Ihr Bestand liegt. Für einen WooCommerce-Shop ist ATUM am umfassendsten, und Stock Manager for WooCommerce ist am schnellsten für Massenänderungen. Für Ware oder Ausrüstung außerhalb eines Shops, über mehrere Lager und mit einem Verlauf, der sich nicht ändern lässt, Plugixa Inventory. Für Buchhaltung und Lagerverwaltung zusammen Bizuno oder WP ERP.
  - q: Welches WordPress-Plugin für die Lagerverwaltung ist kostenlos?
    a: "Alle acht haben eine kostenlose Version, und zwei sind vollständig kostenlos: Stock Manager for WooCommerce und Bizuno. Plugixa Inventory bietet mehrere Lager, Lagerbewegungen und ein gesperrtes Journal kostenlos. ATUM bietet Bestellungen und Lieferanten kostenlos. WP ERP behält Lagerbewegungen seinem Tarif Scale vor."
  - q: Brauche ich WooCommerce, um in WordPress Bestände zu verwalten?
    a: "Nein. Plugixa Inventory, WP Inventory Manager, Zintory, Bizuno und WP ERP führen eigene Datensätze und laufen ohne WooCommerce. ATUM, Stock Manager for WooCommerce und Stock Locations for WooCommerce setzen es voraus."
  - q: Welche Plugins unterstützen mehrere Lager?
    a: "Plugixa Inventory, Bizuno, Zintory und Stock Locations for WooCommerce führen Bestand je Lagerort in ihren kostenlosen Versionen. ATUM und WP Inventory Manager tun das über kostenpflichtige Add-ons. Stock Manager for WooCommerce kann es nicht."
  - q: Welche Plugins haben Bestellungen?
    a: "ATUM, Bizuno und Zintory haben sie kostenlos. WP ERP hat eine kostenlose Seite für Bestellungen, aber der Wareneingang darauf erfordert den Tarif Scale. Plugixa Inventory, Stock Manager for WooCommerce und Stock Locations for WooCommerce haben keine."
  - q: Wo werden meine Bestandsdaten gespeichert?
    a: Alle acht speichern die Daten in Ihrer WordPress-Datenbank. Die WooCommerce-Add-ons führen den Bestand an den WooCommerce-Produkten, teils mit eigenen Tabellen daneben. Die eigenständigen Plugins und die Suiten nutzen eigene Tabellen.
  - q: Wer betreibt diesen Vergleich?
    a: Plugixa, das Unternehmen hinter Plugixa Inventory. Das ist ein Interessenkonflikt. Um ihn zu begrenzen, verlinkt jeder Wert auf seine Quelle, jede Plugin-Seite nennt Schwächen ebenso wie Stärken, und unser eigenes Plugin steht nur dort auf Platz eins, wo die Daten das stützen.
  - q: Wie oft werden die Daten aktualisiert?
    a: Installationszahlen, Bewertungen und Versionsnummern werden jede Woche über die API von wordpress.org abgerufen. Funktionen und Preise werden von Hand geprüft, und jede Plugin-Seite zeigt das Datum der letzten Prüfung.
