# Textes par plugin. `notes` et `texts` sont indexés par identifiant de fonctionnalité (voir src/data/features.yaml).
plugixa-inventory:
  summary: "Un système de gestion de stock qui fonctionne dans WordPress, avec des articles, des entrepôts, des mouvements de stock et un registre de stock non modifiable, ainsi qu'un tableau de bord, la valorisation au coût et l'import et l'export CSV. La version gratuite couvre tout cela ; Pro ajoute les transferts entre entrepôts, les ajustements, la valorisation FIFO et LIFO, les rapports, les champs personnalisés, les unités et des permissions détaillées."
  award: Meilleur registre de stock multi-entrepôts gratuit
  best_for: "Les petites entreprises et les équipes qui détiennent du stock ou du matériel à plusieurs endroits et veulent des quantités exactes par entrepôt et une piste d'audit dans WordPress, sans service de gestion de stock hébergé."
  status: "Nouveau plugin. La version 1.0.0 a été publiée récemment sur wordpress.org, il n'a donc pas encore de base d'installations ni d'avis publics."
  pros:
    - "Le stock est tenu par article et par entrepôt, et plusieurs entrepôts sont inclus gratuitement."
    - "Chaque modification de quantité est inscrite dans un registre de stock qu'aucun écran, aucune route d'API et aucun réglage ne peut modifier ni supprimer, avec un rapprochement qui vérifie les chiffres par rapport à ce registre."
    - "Le prêt et le retour de matériel à des personnes nommées sont gratuits."
    - "Les alertes de stock bas dans l'application et par e-mail, un tableau de bord et la valorisation du stock au coût sont gratuits."
    - "L'import CSV avec correspondance des colonnes, stock initial et annulation, ainsi que l'export CSV depuis chaque liste, sont gratuits."
    - "Les enregistrements sont conservés dans les propres tables du plugin sur votre site ; rien n'est envoyé à Plugixa."
  cons:
    - "Ni bons de commande, ni fournisseurs, ni commandes clients, ni factures."
    - "Pas d'intégration WooCommerce : le stock de la boutique et le stock de l'inventaire sont tenus séparément."
    - "Les transferts entre entrepôts, les ajustements, la valorisation FIFO et LIFO et les rapports nécessitent Pro."
    - "Le numéro de série est un champ unique par article, il n'est pas suivi par unité, et il n'y a pas de lots."
    - "Récent, sans historique ni avis pour l'instant."
  notes:
    items.types: "Chaque article est un bien d'équipement, un consommable ou une marchandise vendable, et le type détermine les mouvements auxquels il peut participer."
    items.serials: "Un article a un champ de numéro de série, consultable par le lecteur de codes-barres, mais les numéros de série et les lots ne sont pas suivis par unité."
    items.images: "Une image par article, choisie dans la médiathèque WordPress."
    items.custom_fields: "Douze types de champs sur les articles, les entrepôts et les destinataires."
    items.units: "Des unités de mesure organisées en chaînes, par exemple une douzaine de pièces, avec conversion entre elles."
    locations.multiple: "Les quantités sont stockées par article et par entrepôt, et chaque entrepôt a sa propre vue d'ensemble avec le stock, les stocks bas et l'activité."
    locations.transfers: "Un transfert inscrit les deux mouvements au registre : la sortie d'un entrepôt et l'entrée dans l'autre."
    movements.receive_issue: "Les documents d'entrée et de sortie de stock sont d'abord créés en brouillon, puis validés, et c'est la validation qui écrit dans le registre."
    movements.checkout: "Les biens d'équipement sont prêtés à un destinataire, c'est-à-dire une personne avec un nom, un e-mail et un service, puis rendus."
    movements.adjustments: "Ajustements d'ajout, de casse et de retrait, chacun avec un motif."
    movements.purchase_orders: "Les réceptions sont des mouvements d'entrée de stock avec un champ de référence ; il n'y a ni fiches fournisseurs ni bons de commande."
    movements.sales_orders: "Il n'y a ni commandes clients ni factures ; le stock sort par des mouvements de sortie ou de prêt."
    ledger.locked: "Les documents validés ne peuvent être ni modifiés ni supprimés, à l'exception des notes et des pièces jointes, et les lignes du registre ne peuvent jamais être changées ; une erreur se corrige par un document inverse."
    valuation.cost: "Le stock est valorisé au prix de revient de l'article selon le coût moyen, avec repli sur le prix de vente uniquement si aucun coût n'est enregistré."
    valuation.fifo_lifo: "FIFO et LIFO conservent une couche de coût pour chaque réception."
    alerts.low_stock: "Chaque article a un niveau de réapprovisionnement, et les articles en dessous apparaissent dans le tableau de bord et dans la cloche de notifications."
    alerts.email: "Un récapitulatif quotidien des stocks bas est envoyé par e-mail aux utilisateurs qui l'ont activé, avec une limitation pour qu'un seul envoi ne déclenche pas une avalanche de messages."
    reports.dashboard: "La valeur du stock, l'évolution des mouvements sur 30 jours, les stocks bas et les articles les plus mouvementés sur un seul écran."
    reports.reports: "Valorisation par catégorie, entrepôt et type, rotation, coût des marchandises vendues, tendances et ancienneté du stock, avec exports CSV."
    data.csv_import: "Articles, catégories, entrepôts et destinataires, avec une étape de correspondance des colonnes, le stock initial sous forme de mouvement validé et une annulation de l'import complet."
    data.rest_api: "Une API REST sous plugixa-inventory/v1, utilisée par l'application elle-même, qui suit donc les mêmes règles de permissions."
    data.wp_cli: "Des commandes WP-CLI pour la maintenance du stock, comme le rapprochement des quantités avec le registre ; il n'y a pas de commandes CLI pour les enregistrements courants."
    access.roles: "Six capacités dédiées au stock et un rôle Inventory Manager prêt à l'emploi sont gratuits ; Pro ajoute un écran pour créer et attribuer des rôles."
    access.permissions: "Par type d'enregistrement et par action, un rôle peut accéder à tous les enregistrements, seulement aux siens, ou à aucun."
    extras.frontend: "Un shortcode place toute l'application sur une page de votre site, dans votre thème, avec les mêmes permissions que dans wp-admin."
    extras.scanner: "Fonctionne avec un lecteur de codes-barres portable qui saisit dans le champ de recherche et retrouve les articles par code-barres, SKU ou numéro de série ; il n'y a pas de lecture par caméra."
    extras.woocommerce: "Le plugin ne lit pas et ne met pas à jour le stock des produits WooCommerce."
  texts:
    extras.storage: "Votre base de données WordPress, dans les propres tables du plugin"

stock-manager-for-woocommerce:
  summary: "Stock Manager for WooCommerce est un éditeur sous forme de tableau, gratuit, pour le stock, les prix et les SKU de WooCommerce, avec un journal de stock simple et l'import et l'export CSV. Il n'a pas de version payante propre ; ses liens de mise à niveau renvoient vers Smart Manager, un plugin distinct de StoreApps."
  award: "Idéal pour les modifications rapides du stock en masse"
  best_for: "Les petites boutiques WooCommerce qui veulent modifier le stock de nombreux produits et variations sur un seul écran et consulter un historique de stock basique."
  status: "Gratuit uniquement. L'entrée de menu « Go Pro » mène à Smart Manager Pro, un autre produit de StoreApps."
  pros:
    - "Entièrement gratuit, sans formule payante propre."
    - "Modifiez le stock, les prix, le SKU, la classe de taxe et la classe de livraison des produits et des variations dans un seul tableau."
    - "Enregistre une entrée dans le journal de stock à chaque modification du stock d'un produit, y compris par les commandes."
    - "Export et import CSV des données de stock."
    - "Léger et simple, avec peu de réglages à apprendre."
  cons:
    - "Nécessite WooCommerce ; il ne modifie que les produits WooCommerce."
    - "Ni emplacements, ni bons de commande, ni fournisseurs, ni valorisation du stock."
    - "Le journal de stock ne conserve que la date et la nouvelle quantité, sans utilisateur ni motif."
    - "Le readme indique que l'import et l'export CSV doivent être remaniés et s'utilisent à vos risques."
    - "Ni API REST, ni commandes WP-CLI, ni prise en charge des codes-barres."
    - "Ajoute au menu d'administration des pages de promotion pour Smart Manager de StoreApps."
  notes:
    items.sku_barcode: "Vous pouvez modifier le SKU WooCommerce, mais le plugin n'ajoute pas de champ code-barres."
    items.images: "Le tableau affiche la miniature du produit WooCommerce."
    items.custom_fields: "Le readme renvoie au plugin distinct Smart Manager pour les champs personnalisés."
    movements.receive_issue: "Le stock est changé en modifiant la quantité ; il n'y a pas de documents de réception ou de sortie."
    movements.adjustments: "Le journal de stock ne conserve que la date, le produit et la quantité, il n'y a donc pas de motif d'ajustement."
    movements.sales_orders: "Les commandes WooCommerce réduisent le stock comme d'habitude, et chaque modification est inscrite dans le journal de stock."
    ledger.history: "Le plugin intercepte les modifications de stock de WooCommerce et enregistre la nouvelle quantité avec une date dans sa propre table stock_log."
    ledger.locked: "Le plugin ne propose aucun écran pour modifier ou supprimer les entrées du journal, mais la table n'a pas d'autre protection."
    alerts.low_stock: "Les lignes sous le seuil global de stock bas de WooCommerce sont mises en évidence ; il n'y a pas de liste séparée des stocks bas."
    alerts.email: "Le plugin n'envoie pas d'e-mails propres ; les e-mails de stock intégrés à WooCommerce restent actifs."
    reports.dashboard: "Le « tableau de bord » est un tableau de produits modifiable, pas une vue d'ensemble statistique."
    data.csv_import: "Le readme indique que l'import et l'export doivent être remaniés et doivent être utilisés à vos risques."
    data.rest_api: "Le plugin ajoute seulement un filtre de rupture de stock au point d'accès REST des produits WooCommerce et n'a pas d'API propre."
    access.roles: "L'accès repose sur la capacité manage_woocommerce de WooCommerce, qu'un filtre permet de changer."
    extras.woocommerce: "Le plugin est conçu pour WooCommerce et le nécessite."
  texts:
    extras.storage: "Les métadonnées des produits WooCommerce pour le stock et les prix, plus sa propre table stock_log contenant la date, l'ID du produit et la quantité."

atum:
  summary: "ATUM est un plugin WooCommerce gratuit qui ajoute un écran Stock Central, des fournisseurs, des bons de commande, des journaux de stock et un tableau de bord statistique aux produits WooCommerce. Le stock multi-emplacements, les nomenclatures, l'export CSV, les journaux d'audit et la lecture de codes-barres sont vendus sous forme d'add-ons annuels séparés."
  award: "Meilleur socle gratuit pour le stock WooCommerce"
  best_for: "Les boutiques WooCommerce qui veulent gratuitement des bons de commande, des fournisseurs et des vues d'ensemble du stock, et qui acceptent d'acheter des add-ons pour les entrepôts ou la fabrication."
  pros:
    - "Le socle gratuit comprend les bons de commande, les fournisseurs, le stock entrant et les journaux de stock."
    - "Stock Central affiche tous les produits, les SKU, les prix d'achat et le stock sur un seul écran."
    - "Des widgets de tableau de bord pour les ventes, les ventes perdues, le contrôle du stock et la valeur actuelle du stock."
    - "Une API REST documentée et des commandes WP-CLI dans le plugin gratuit."
    - "Des capacités détaillées pour les bons de commande, les journaux de stock et les fournisseurs."
    - "Les add-ons couvrent le multi-inventaire, les nomenclatures, les inventaires physiques et la préparation des commandes."
  cons:
    - "Nécessite WooCommerce ; il ne gère que les produits WooCommerce."
    - "Un stock séparé par entrepôt nécessite l'add-on payant Multi-Inventory."
    - "L'export et l'import CSV nécessitent l'add-on payant Export PRO ; le plugin gratuit exporte en PDF."
    - "Un historique complet des modifications nécessite l'add-on payant Action Logs."
    - "Les add-ons sont facturés individuellement chaque année, la facture monte donc vite avec plusieurs add-ons."
    - "La politique de remboursement de l'éditeur ne prévoit pas de garantie générale satisfait ou remboursé."
  notes:
    items.types: "L'add-on Product Levels ajoute Raw Material, Product Part et leurs versions variables comme types de produits WooCommerce."
    items.sku_barcode: "Les SKU sont le champ propre à WooCommerce, et le plugin gratuit ajoute un champ code-barres aux produits et aux variations."
    items.serials: "Multi-Inventory suit les numéros de lot et les dates de péremption par inventaire, pas les numéros de série par unité."
    locations.multiple: "Le plugin gratuit se contente d'étiqueter les produits avec des termes d'emplacement ; des quantités séparées par emplacement nécessitent Multi-Inventory."
    movements.receive_issue: "Les journaux de stock augmentent ou réduisent le stock, et les bons de commande ajoutent du stock à la réception des articles."
    movements.adjustments: "Les types de journaux de stock comprennent Reserved Stock, Customer Returns, Warehouse Damage, Lost in Post et Other."
    movements.purchase_orders: "Les bons de commande gratuits ajoutent du stock à la réception ; Purchase Orders PRO ajoute les livraisons, les factures et d'autres fonctions."
    movements.sales_orders: "Le stock est réduit par les commandes WooCommerce habituelles."
    ledger.history: "L'add-on Action Logs enregistre chaque modification avec l'utilisateur, la source et l'heure ; le plugin gratuit ne conserve que les journaux de stock et les notes de commande."
    valuation.cost: "Le plugin gratuit enregistre les prix d'achat et affiche un widget de tableau de bord Current Stock Value calculé à partir de ceux-ci."
    valuation.fifo_lifo: "Multi-Inventory peut vendre à partir des inventaires selon un ordre FIFO, LIFO ou par date de péremption, mais il s'agit d'un ordre de vente, pas d'une valorisation au coût FIFO ou LIFO."
    alerts.email: "Le plugin s'appuie sur les e-mails de stock bas et de rupture de stock intégrés à WooCommerce et peut les retenir dans certains cas."
    reports.reports: "Les rapports se limitent aux statistiques du tableau de bord et à un export PDF de Stock Central."
    data.csv_import: "Export PRO est présenté comme un outil d'export et d'import ; le détail de l'import n'a pas été vérifié en profondeur."
    data.csv_export: "Export PRO exporte en CSV, XML ou JSON, manuellement ou selon une planification ; le plugin gratuit n'exporte qu'en PDF."
    data.wp_cli: "Le plugin gratuit enregistre une commande « wp atum » qui lance les outils d'ATUM."
    access.roles: "Le plugin ajoute ses propres capacités, comme atum_edit_purchase_price et atum_read_inbound_stock, plutôt que ses propres rôles."
    access.permissions: "Les capacités distinguent vos propres bons de commande, journaux et fournisseurs de ceux des autres utilisateurs, mais le plugin gratuit n'a pas de règles d'accès par emplacement."
    extras.frontend: "Multi-Inventory peut limiter les inventaires par région pour que les clients voient le stock et les prix de leur zone ; aucun autre affichage sur le site public n'a été confirmé."
    extras.scanner: "Barcodes PRO permet de rechercher dans les tableaux d'ATUM par code-barres scanné et prend en charge les formats 1D et 2D."
    extras.woocommerce: "ATUM est une extension WooCommerce et nécessite WooCommerce."
  texts:
    extras.storage: "Les produits WooCommerce et leurs métadonnées, plus les propres tables d'ATUM (atum_product_data, atum_order_items, atum_order_itemmeta) pour les données de stock, les bons de commande et les journaux de stock."

wp-erp:
  summary: "WP ERP est une suite gratuite de RH, CRM et comptabilité pour WordPress. Le module de comptabilité gratuit propose des produits et des bons de commande, mais le suivi du stock vient de l'extension Inventory, qui fait partie de la formule payante Scale."
  award: Idéal pour les RH et la comptabilité ensemble
  best_for: "Les petites entreprises qui gèrent déjà leurs RH, leur CRM ou leur comptabilité dans WP ERP et ont besoin de quantités de stock simples liées aux achats et aux ventes."
  pros:
    - "Un socle gratuit avec des modules RH, CRM et comptabilité, sans limite d'utilisateurs."
    - "Le stock augmente avec les achats et diminue avec les ventes, les quantités suivent donc les transactions réelles."
    - "Des rapports d'achats de produits, de ventes de produits et de stock dans le module de comptabilité."
    - "Les produits peuvent être importés et exportés en CSV dans la version gratuite."
    - "Les produits ont un type : stock ou service."
    - "Un développement actif, avec une mise à jour en octobre 2026."
  cons:
    - "Le suivi du stock nécessite la formule Scale à 474 USD par an, dont le prix dépend du nombre d'utilisateurs."
    - "Ni entrepôts, ni transferts, ni ajustements de stock documentés."
    - "Ni alertes de stock bas, ni codes-barres, ni numéros de série, ni unités de mesure documentés."
    - "La méthode de valorisation n'est pas documentée."
    - "L'éditeur indique que la synchronisation du stock avec WooCommerce est encore en cours de développement."
    - "Le délai de remboursement est de 14 jours."
  notes:
    items.types: "Le module de comptabilité gratuit a deux types de produits, Inventory et Service."
    items.sku_barcode: "L'écran Inventory affiche un code article ; aucun champ code-barres n'est documenté."
    movements.receive_issue: "Les achats ajoutent du stock et les ventes en retirent, avec un enregistrement par transaction."
    movements.checkout: "L'extension distincte Asset Manager attribue les biens de l'entreprise aux salariés, mais elle n'est pas liée au stock."
    movements.purchase_orders: "Les bons de commande font partie du module de comptabilité gratuit ; le stock n'est réceptionné qu'avec l'extension Inventory."
    ledger.history: "Les entrées et sorties de stock sont stockées par transaction dans la base de données ; aucun écran d'historique par article n'est documenté."
    reports.reports: "Des rapports d'achats de produits, de ventes de produits et de stock sont disponibles, et la plupart des rapports s'exportent en CSV."
    data.csv_import: "Importe la liste des produits depuis un CSV, pas les quantités en stock."
    data.csv_export: "Exporte la liste des produits en CSV."
    data.rest_api: "Le plugin a des routes REST pour les produits et les catégories, mais nous n'avons trouvé aucune documentation publique de l'API."
    data.wp_cli: "Des commandes WP-CLI existent pour les modules, les RH et le CRM, mais aucune pour les produits ou le stock."
    access.roles: "Seul le rôle Accounting Manager peut utiliser les menus Inventory ; il n'y a pas de rôle limité au stock."
    extras.woocommerce: "L'intégration WooCommerce de la formule Growth synchronise les commandes avec la comptabilité, pas le stock."
  texts:
    extras.storage: "Des tables personnalisées avec le préfixe erp_acct_ dans la base de données WordPress, sur votre propre serveur."

wp-inventory-manager:
  summary: "WP Inventory Manager est un plugin de catalogue et de comptage de stock présent depuis longtemps, qui stocke les articles dans ses propres tables et les affiche sur le site public avec un shortcode. Le socle gratuit couvre un nombre illimité d'articles, les images, les catégories et une seule quantité par article ; les emplacements, les types d'articles, les champs personnalisés, le CSV, un registre de stock et les statistiques sont des add-ons payants qui nécessitent une licence Pro ou All Access."
  award: "Idéal pour les catalogues de stock publics"
  best_for: "Choisissez-le si vous voulez surtout présenter du matériel, des pièces ou des collections sur votre site et tenir un simple comptage des quantités, et si vous acceptez d'acheter des add-ons pour aller plus loin."
  pros:
    - "Le socle gratuit n'a pas de limite d'articles et ne nécessite pas WooCommerce."
    - "Une liste sur le site public avec recherche et tri via le shortcode [wpinventory]."
    - "Photos des articles, seuil de stock bas et petit tableau de bord d'état dans la version gratuite."
    - "Un large choix d'add-ons : emplacements, types d'articles, import/export CSV, registre, statistiques, QR codes."
    - "Maintenu activement (2.5.9, mis à jour en octobre 2026), avec une garantie satisfait ou remboursé de 30 jours."
  cons:
    - "La version gratuite suit une seule quantité par article ; il n'y a pas de mouvements de stock."
    - "La plupart des fonctions de stock sont des add-ons annuels séparés ($24.99–$79.99 chacun), en plus d'une licence Pro."
    - "Les entrées du registre peuvent être modifiées ou supprimées, l'historique n'est donc pas infalsifiable."
    - "Ni bons de commande, ni valorisation du stock documentée, ni transferts enregistrés entre emplacements."
    - "Ni API REST ni commandes WP-CLI dans le code du plugin."
  notes:
    items.sku_barcode: "Chaque article a un champ de référence ; il n'y a pas de champ code-barres dédié."
    items.serials: "Un champ de numéro de série par fiche article, pas par unité."
    items.custom_fields: "La version gratuite permet seulement de renommer ses champs fixes ; de nouveaux champs nécessitent l'add-on."
    movements.receive_issue: "Le registre enregistre les hausses et les baisses dues aux réservations ou aux saisies manuelles ; la version gratuite ne fait que modifier la quantité."
    movements.adjustments: "Les saisies manuelles dans le registre peuvent changer la quantité, mais il n'y a pas de champ dédié au motif."
    movements.sales_orders: "Le registre peut générer des factures clients à partir des entrées ; aucun processus complet de commande client n'est décrit."
    ledger.history: "Le registre consigne les réservations et les saisies manuelles ; Locations Manager consigne aussi les modifications de quantité."
    ledger.locked: "La documentation du registre indique que chaque entrée peut être modifiée ou supprimée."
    alerts.low_stock: "Un seuil global de quantité basse met en évidence les articles dans l'administration et les compte sur le tableau de bord."
    alerts.email: "L'e-mail gratuit de quantité basse n'est envoyé qu'après une réservation sur le site public ; l'add-on Notifications couvre des alertes plus larges."
    reports.dashboard: "La version gratuite affiche des tuiles de comptage ; les graphiques et les ventilations viennent avec l'add-on Analytics."
    reports.reports: "Analytics couvre des synthèses par catégorie, statut, emplacement, stock bas et réservation, mais aucun rapport de valorisation ou de mouvements."
    access.roles: "Un réglage choisit le rôle WordPress minimal qui peut ajouter ou modifier des articles ; il n'y a pas de rôles dédiés au stock."
    access.permissions: "Vous pouvez limiter les non-administrateurs à la modification de leurs propres articles ; des règles par utilisateur nécessitent Advanced User Control."
    extras.frontend: "Le shortcode [wpinventory] affiche une liste d'articles consultable et triable sur n'importe quelle page."
    extras.scanner: "Génère des QR codes qui ouvrent l'article dans l'administration depuis la caméra d'un téléphone ; il ne déplace pas de stock."
    extras.woocommerce: "Le plugin fonctionne de façon indépendante et n'a pas d'intégration WooCommerce."
  texts:
    extras.storage: "Ses propres tables en base de données (wpinventory_item, category, image, status et d'autres)."

stock-locations-for-woocommerce:
  summary: "Stock Locations for WooCommerce répartit le stock d'un produit entre des emplacements comme des magasins ou des entrepôts, et déduit le stock du bon emplacement quand les commandes arrivent. La version gratuite couvre les emplacements, l'affectation des commandes, l'accès REST et des shortcodes pour le site public, tandis qu'une version premium ajoute des cartes, des archives d'emplacements et quelques options d'affichage."
  award: "Meilleur stock par emplacement gratuit pour WooCommerce"
  best_for: "Les boutiques WooCommerce avec plusieurs magasins ou entrepôts qui ont besoin du stock par emplacement et veulent que les clients voient ou choisissent un emplacement."
  pros:
    - "Stock par emplacement gratuit pour les produits simples et variables."
    - "Les commandes sont affectées aux emplacements automatiquement ou par le client."
    - "Des shortcodes affichent le stock par emplacement sur les pages produits et le panier."
    - "Prix par emplacement et notifications par e-mail pour chaque emplacement."
    - "API REST et points d'accès cron pour mettre à jour le stock par emplacement."
    - "Champs code-barres ISBN, UPC, EAN et ASIN sur les produits."
  cons:
    - "Nécessite WooCommerce ; il ne fait qu'étendre les produits WooCommerce."
    - "Ni transferts de stock, ni bons de commande, ni enregistrements d'ajustement."
    - "Ni valorisation du stock, ni alertes de stock bas par emplacement."
    - "L'import et l'export CSV nécessitent un add-on payant séparé."
    - "Une petite équipe de développement et environ 900 installations actives."
    - "La politique de remboursement ne couvre que les fonctionnalités qui ne fonctionnent pas comme annoncé."
  notes:
    items.sku_barcode: "Les SKU sont le champ propre à WooCommerce, et le plugin ajoute un onglet Barcodes avec des champs ISBN, UPC, EAN et ASIN."
    items.images: "Les produits utilisent les images de WooCommerce ; le plugin n'ajoute pas de gestion d'images propre."
    locations.multiple: "Les emplacements sont une taxonomie de produits, et le stock par emplacement est enregistré dans les métadonnées du produit."
    movements.receive_issue: "Le stock par emplacement est changé en modifiant le nombre sur le produit ou via l'API, pas par des documents de réception."
    movements.sales_orders: "Les commandes WooCommerce réduisent le stock de l'emplacement affecté, et les commandes annulées peuvent le rétablir."
    ledger.history: "Les déductions par emplacement sont inscrites dans les notes de commande WooCommerce et dans un journal de débogage facultatif, mais il n'y a pas d'écran d'historique par article."
    alerts.low_stock: "Le plugin n'a pas de seuils de stock bas par emplacement ; le seuil propre à WooCommerce s'applique toujours au stock total."
    alerts.email: "Des e-mails sont envoyés quand du stock est affecté à un emplacement et pour les nouvelles commandes, pas en cas de stock bas."
    data.csv_import: "L'import CSV fait partie d'un add-on Import/Export séparé, affiché dans le plugin à €29."
    data.csv_export: "L'export CSV fait partie du même add-on Import/Export séparé, affiché à €29."
    data.rest_api: "Le readme documente GET et PUT sur les points d'accès produits de WooCommerce et un point d'accès d'emplacement, ainsi qu'une API JSON avec clé."
    access.roles: "La gestion des emplacements repose sur la capacité manage_woocommerce de WooCommerce ; il n'y a pas de rôles propres au plugin."
    extras.frontend: "Des shortcodes affichent le stock par emplacement sur les pages produits et le panier, et les clients peuvent choisir un emplacement ; les cartes et les archives d'emplacements sont premium."
    extras.woocommerce: "Le plugin est une extension WooCommerce et nécessite WooCommerce 3.4 ou une version ultérieure."
  texts:
    extras.storage: "Les métadonnées des produits WooCommerce (clés _stock_at_<location>) plus une taxonomie « location » pour les emplacements ; aucune table personnalisée."

zintory:
  summary: "Zintory est un plugin de gestion de stock fondé sur les transactions, où le stock circule entre des comptes configurables comme des entrepôts, des fournisseurs et des clients. La version gratuite couvre les articles, les comptes, les types de transactions et le stock par emplacement ; une licence Pro payée une seule fois ajoute la duplication de transactions, des statistiques par article et l'historique des modifications."
  award: "Idéal pour un suivi de stock simple par transactions"
  best_for: "Choisissez-le si vous voulez que le stock ne change que par des achats, des ventes et des déplacements entre emplacements enregistrés, et si vous n'avez besoin ni de photos d'articles, ni de champs personnalisés, ni d'alertes."
  status: "Petite base d'utilisateurs (30+ installations actives) ; la version 4 est une réécriture du plugin précédent, mise à jour pour la dernière fois en juillet 2026."
  pros:
    - "Les modifications de stock sont enregistrées comme des transactions, et non par la modification d'un nombre."
    - "Les quantités sont suivies par entrepôt ou emplacement dans la version gratuite."
    - "Des types de comptes et de transactions configurables, adaptés aux achats, aux ventes, aux transferts ou aux locations."
    - "Des états brouillon, confirmé et terminé avant que le stock ne soit modifié."
    - "Pro coûte $59 en un seul paiement, avec des mises à jour à vie."
    - "Possibilité d'utiliser les produits WooCommerce comme liste d'articles."
  cons:
    - "Les articles n'ont qu'un titre, un SKU et une description : ni images, ni champs personnalisés, ni unités, ni numéros de série."
    - "Ni seuils de stock bas, ni alertes par e-mail, ni tableau de bord."
    - "Les transactions terminées peuvent encore être supprimées, l'historique n'est donc pas verrouillé."
    - "Ni import CSV, ni affichage sur le site public, ni lecture de codes-barres dans le code gratuit."
    - "Une très petite base d'installations et une documentation succincte."
  notes:
    items.types: "Les types de comptes et de transactions sont configurables, mais les articles eux-mêmes n'ont pas de type."
    items.sku_barcode: "Les articles ont un champ SKU ; il n'y a pas de champ code-barres."
    locations.multiple: "Les types de comptes qui suivent les quantités (comme Warehouse) ont chacun leur propre solde de stock."
    locations.transfers: "Vous créez un type de transaction entre deux comptes d'entrepôt pour enregistrer un déplacement."
    movements.receive_issue: "Le stock est calculé à partir des transactions terminées entre comptes."
    movements.checkout: "Les prêts peuvent être modélisés avec des comptes et des types de transactions personnalisés, mais il n'y a ni dates d'échéance ni outils de retour."
    movements.adjustments: "Des types de transactions à sens unique permettent d'ajuster un emplacement ; la description de la transaction est le seul endroit où indiquer un motif."
    movements.purchase_orders: "Un type Purchase par défaut déplace le stock d'un fournisseur vers un entrepôt, avec une numérotation PO- et des prix."
    movements.sales_orders: "Un type Sale par défaut, avec une numérotation SO-, réduit le stock ; il n'y a pas de factures."
    ledger.history: "Chaque article a une liste des transactions dans lesquelles il apparaît ; la version Pro ajoute un historique complet des modifications."
    ledger.locked: "Les transactions, dans n'importe quel état, y compris terminé, peuvent être supprimées depuis l'administration."
    alerts.low_stock: "La fiche du plugin parle de réagir aux stocks bas, mais le code n'a ni niveau de réapprovisionnement ni avertissement."
    reports.reports: "Pro ajoute des statistiques par article (vendu, acheté, déplacé et prix moyen) ; il n'y a pas de rapports plus larges."
    access.roles: "Les administrateurs WordPress y ont accès, et vous pouvez ajouter d'autres utilisateurs WordPress comme administrateurs du plugin."
    extras.woocommerce: "Un réglage charge la liste d'articles à partir des produits WooCommerce ; il ne synchronise pas les niveaux de stock en retour."
  texts:
    extras.storage: "Ses propres tables en base de données (articles, comptes, transactions et lignes de transaction)."

bizuno:
  summary: "Bizuno est un ERP et un système de comptabilité en partie double, gratuit et open source, qui fonctionne dans WordPress. Son module de stock est inclus sans frais et couvre plusieurs magasins, les numéros de série, les assemblages et la valorisation FIFO, LIFO ou au coût moyen."
  award: Meilleur ERP complet gratuit pour le stock
  best_for: "Les entreprises qui veulent une comptabilité complète avec un stock relié aux comptes, sans coût de licence, et qui peuvent gérer un système plus complexe."
  status: "Petite base d'installations (environ 20 installations actives). Mis à jour pour la dernière fois en juin 2026 et testé jusqu'à WordPress 6.9."
  pros:
    - "Gratuit et open source (AGPL), sans formules payantes ni frais par utilisateur."
    - "Stock par magasin, avec des transferts entre magasins et des ajustements enregistrés."
    - "Valorisation FIFO, LIFO ou au coût moyen par article, avec des couches de coût dans l'historique."
    - "Articles avec numéros de série, assemblages et variantes d'articles à partir d'articles maîtres."
    - "De nombreux rapports de stock, dont la valorisation, les mouvements et une feuille de réapprovisionnement."
    - "Import et export CSV des articles, champs personnalisés compris."
  cons:
    - "Une très petite base d'utilisateurs et peu d'avis."
    - "Les écritures validées peuvent être supprimées par les utilisateurs qui ont le droit de suppression."
    - "Fonctionne comme une application à part, avec une connexion séparée, et non comme des écrans WordPress classiques."
    - "Le plugin de connexion à WooCommerce a été fermé sur WordPress.org en octobre 2025."
    - "Ni e-mail de stock bas ni lecture de codes-barres documentés."
    - "La documentation de l'API REST ne liste pas de points d'accès pour le stock."
  notes:
    items.sku_barcode: "Chaque article a un SKU et un champ code UPC."
    items.units: "Chaque article a une unité d'achat et une unité de vente, avec une quantité qui permet de convertir de l'une à l'autre."
    movements.adjustments: "Les ajustements ont une description libre par ligne plutôt qu'une liste fixe de motifs."
    ledger.locked: "Les utilisateurs qui ont le droit de suppression peuvent supprimer des écritures validées ; une option par utilisateur limite les modifications à la période en cours."
    alerts.low_stock: "Les articles ont des quantités minimales et de réapprovisionnement, et un rapport de réapprovisionnement liste ce qu'il faut acheter."
    reports.reports: "Comprend des rapports de valorisation, de mouvements, d'ancienneté, d'historique par SKU, de transferts et de réapprovisionnement."
    data.rest_api: "Une API REST est documentée, mais les modules qu'elle liste couvrent les commandes, l'expédition, les paiements et l'import ou l'export, pas directement le stock."
    access.roles: "Les rôles définissent des niveaux de sécurité par domaine, dont un niveau distinct pour le stock."
    access.permissions: "Les utilisateurs peuvent être limités à un seul magasin, à leurs propres enregistrements ou à la période en cours."
    extras.frontend: "L'application complète fonctionne sur une page /bizuno du site public, avec sa propre connexion."
    extras.woocommerce: "Bizuno envoie les produits, le stock et les prix vers WooCommerce, mais la boutique a besoin du plugin bizuno-api, qui n'est plus sur WordPress.org."
  texts:
    extras.storage: "Des tables personnalisées avec le préfixe bizuno_ dans la base de données WordPress, et des fichiers dans le dossier uploads/bizuno."
