# Prose per plugin. `notes` and `texts` are keyed by feature id (see src/data/features.yaml).
plugixa-inventory:
  summary: "Un sistema di magazzino che funziona dentro WordPress, con articoli, magazzini, movimenti di magazzino e un registro di magazzino non modificabile, più una dashboard, la valorizzazione al costo e importazione ed esportazione CSV. La versione gratuita copre tutto questo; Pro aggiunge trasferimenti tra magazzini, rettifiche, costo FIFO e LIFO, report, campi personalizzati, unità di misura e permessi granulari."
  award: "Il miglior registro di magazzino multi-magazzino gratuito"
  best_for: "Piccole aziende e team che tengono merce o attrezzature in più di un luogo e vogliono quantità corrette per magazzino e una traccia di audit dentro WordPress, senza un servizio di magazzino in hosting."
  status: "Plugin nuovo. La versione 1.0.0 è stata pubblicata su wordpress.org da poco, quindi non ha ancora una base di installazioni né recensioni pubbliche."
  pros:
    - "Le giacenze sono tenute per articolo e per magazzino, e i magazzini multipli sono gratuiti."
    - "Ogni variazione di quantità viene scritta in un registro di magazzino che nessuna schermata, rotta API o impostazione può modificare o eliminare, con una riconciliazione che confronta i numeri con il registro."
    - "Il prestito e la restituzione di attrezzature a persone con nome sono gratuiti."
    - "Avvisi di scorta bassa nell'app e via email, una dashboard e la valorizzazione al costo sono gratuiti."
    - "L'importazione CSV con abbinamento delle colonne, giacenza iniziale e annullamento, più l'esportazione CSV da ogni elenco, sono gratuite."
    - "I record stanno nelle tabelle di database del plugin sul tuo sito; nulla viene inviato a Plugixa."
  cons:
    - "Niente ordini d'acquisto, fornitori, ordini di vendita o fatture."
    - "Nessuna integrazione con WooCommerce, quindi le giacenze del negozio e quelle del magazzino sono tenute separatamente."
    - "Trasferimenti tra magazzini, rettifiche, costo FIFO e LIFO e report richiedono Pro."
    - "Il numero di serie è un solo campo per articolo, non è registrato per unità, e non ci sono lotti."
    - "È nuovo, senza ancora uno storico né recensioni."
  notes:
    items.types: "Ogni articolo è un bene, un materiale di consumo o una merce in vendita, e il tipo decide a quali movimenti può partecipare."
    items.serials: "Un articolo ha un campo per il numero di serie, ricercabile dal lettore, ma numeri di serie e lotti non sono registrati per unità."
    items.images: "Un'immagine per articolo, scelta dalla libreria media di WordPress."
    items.custom_fields: "Dodici tipi di campo su articoli, magazzini e destinatari."
    items.units: "Unità di misura organizzate in catene, come una dozzina di pezzi, con la conversione tra l'una e l'altra."
    locations.multiple: "Le quantità sono salvate per articolo e per magazzino, e ogni magazzino ha una propria panoramica con giacenze, scorte basse e attività."
    locations.transfers: "Un trasferimento scrive nel registro entrambe le parti, l'uscita da un magazzino e l'entrata nell'altro."
    movements.receive_issue: "I documenti di carico e scarico vengono prima creati in bozza, poi finalizzati, ed è la finalizzazione a scrivere il registro."
    movements.checkout: "I beni vengono prestati a un destinatario, una persona con nome, email e reparto, e poi restituiti."
    movements.adjustments: "Rettifiche di aggiunta, danno e sottrazione, ciascuna con una causale."
    movements.purchase_orders: "I ricevimenti sono movimenti di carico con un campo di riferimento; non ci sono anagrafiche fornitori né ordini d'acquisto."
    movements.sales_orders: "Non ci sono ordini di vendita né fatture; la merce esce con movimenti di scarico o di prestito."
    ledger.locked: "I documenti finalizzati non si possono modificare né eliminare, salvo note e allegati, e le righe del registro non cambiano mai; un errore si corregge con un documento di segno opposto."
    valuation.cost: "Le giacenze sono valorizzate al prezzo di costo dell'articolo con il costo medio, e solo se non c'è un costo registrato si usa il prezzo di vendita."
    valuation.fifo_lifo: "FIFO e LIFO tengono uno strato di costo per ogni ricevimento."
    alerts.low_stock: "Ogni articolo ha un livello di riordino, e gli articoli sotto quel livello compaiono nella dashboard e nella campanella delle notifiche."
    alerts.email: "Un riepilogo giornaliero via email delle scorte basse agli utenti che lo attivano, limitato in modo che un invio non generi una valanga di messaggi."
    reports.dashboard: "Valore delle giacenze, andamento dei movimenti a 30 giorni, scorte basse e gli articoli più movimentati in un'unica schermata."
    reports.reports: "Valorizzazione per categoria, magazzino e tipo, rotazione, costo del venduto, andamenti e anzianità delle giacenze, con esportazioni CSV."
    data.csv_import: "Articoli, categorie, magazzini e destinatari, con un passaggio di abbinamento delle colonne, la giacenza iniziale come movimento finalizzato e l'annullamento dell'intera importazione."
    data.rest_api: "Un'API REST sotto plugixa-inventory/v1 usata dall'app stessa, quindi segue le stesse regole di permesso."
    data.wp_cli: "Comandi WP-CLI per la manutenzione delle giacenze, come la riconciliazione delle quantità con il registro; non ci sono comandi CLI per i record di tutti i giorni."
    access.roles: "Sei capability di magazzino e un ruolo Inventory Manager già pronto sono gratuiti; Pro aggiunge una schermata per creare e assegnare ruoli."
    access.permissions: "Per tipo di record e per azione, un ruolo può accedere a tutti i record, solo ai propri o a nessuno."
    extras.frontend: "Uno shortcode mette l'intera app in una pagina del tuo sito, dentro il tuo tema, con gli stessi permessi di wp-admin."
    extras.scanner: "Funziona con un lettore di codici a barre manuale che scrive nella casella di ricerca e trova gli articoli per codice a barre, SKU o numero di serie; non c'è la lettura con fotocamera."
    extras.woocommerce: "Il plugin non legge né aggiorna le giacenze dei prodotti WooCommerce."
  texts:
    extras.storage: "Il tuo database WordPress, nelle tabelle proprie del plugin"

stock-manager-for-woocommerce:
  summary: "Stock Manager for WooCommerce è un editor a tabella gratuito per giacenze, prezzi e SKU di WooCommerce, con un semplice log delle giacenze e importazione ed esportazione CSV. Non ha una versione a pagamento propria; i suoi link di upgrade portano al plugin separato Smart Manager di StoreApps."
  award: "Il migliore per modifiche rapide in blocco delle giacenze"
  best_for: "Piccoli negozi WooCommerce che vogliono modificare le giacenze di molti prodotti e variazioni in un'unica schermata e vedere uno storico di base."
  status: "Solo gratuito. La voce di menu \"Go Pro\" porta a Smart Manager Pro, un altro prodotto di StoreApps."
  pros:
    - "Interamente gratuito, senza un livello a pagamento proprio."
    - "Modifica giacenze, prezzi, SKU, imposte e classe di spedizione di prodotti e variazioni in un'unica tabella."
    - "Registra una voce nel log delle giacenze ogni volta che la giacenza di un prodotto cambia, anche per effetto degli ordini."
    - "Esportazione e importazione CSV dei dati di giacenza."
    - "Piccolo e semplice, con poche impostazioni da imparare."
  cons:
    - "Richiede WooCommerce; modifica solo prodotti WooCommerce."
    - "Niente sedi, ordini d'acquisto, fornitori o valorizzazione delle giacenze."
    - "Il log delle giacenze salva solo la data e la nuova quantità, senza utente né causale."
    - "Il readme dice che l'importazione e l'esportazione CSV vanno riscritte e si usano a proprio rischio."
    - "Niente API REST, comandi WP-CLI o supporto per i codici a barre."
    - "Aggiunge al menu di amministrazione pagine promozionali per Smart Manager di StoreApps."
  notes:
    items.sku_barcode: "Puoi modificare lo SKU di WooCommerce, ma il plugin non aggiunge un campo per il codice a barre."
    items.images: "La tabella mostra la miniatura del prodotto WooCommerce."
    items.custom_fields: "Per i campi personalizzati il readme rimanda al plugin separato Smart Manager."
    movements.receive_issue: "La giacenza si cambia modificando la quantità; non ci sono documenti di carico o scarico."
    movements.adjustments: "Il log delle giacenze salva solo data, prodotto e quantità, quindi non c'è una causale di rettifica."
    movements.sales_orders: "Gli ordini WooCommerce riducono la giacenza come di consueto, e ogni variazione viene scritta nel log delle giacenze."
    ledger.history: "Il plugin intercetta le variazioni di giacenza di WooCommerce e salva la nuova quantità con una data nella propria tabella stock_log."
    ledger.locked: "Il plugin non offre schermate per modificare o eliminare le voci del log, ma la tabella non ha altre protezioni."
    alerts.low_stock: "Le righe sotto la soglia globale di scorta bassa di WooCommerce sono evidenziate; non c'è un elenco separato delle scorte basse."
    alerts.email: "Il plugin non invia email proprie; restano valide le email di giacenza integrate in WooCommerce."
    reports.dashboard: "La \"dashboard\" è una tabella dei prodotti modificabile, non una panoramica statistica."
    data.csv_import: "Il readme dice che importazione ed esportazione vanno riscritte e si usano a proprio rischio."
    data.rest_api: "Il plugin aggiunge solo un filtro per i prodotti esauriti all'endpoint REST dei prodotti di WooCommerce e non ha un'API propria."
    access.roles: "L'accesso usa la capability manage_woocommerce di WooCommerce, che si può cambiare con un filtro."
    extras.woocommerce: "Il plugin è costruito per WooCommerce e lo richiede."
  texts:
    extras.storage: "I meta dei prodotti WooCommerce per giacenze e prezzi, più una tabella stock_log propria con data, ID prodotto e quantità."

atum:
  summary: "ATUM è un plugin gratuito per WooCommerce che aggiunge una schermata Stock Central, fornitori, ordini d'acquisto, log di magazzino e una dashboard statistica ai prodotti WooCommerce. Giacenze su più sedi, distinte base, esportazione CSV, log di audit e lettura dei codici a barre sono venduti come add-on annuali separati."
  award: "Il miglior nucleo gratuito per le giacenze WooCommerce"
  best_for: "Negozi WooCommerce che vogliono gratis ordini d'acquisto, fornitori e panoramiche delle giacenze, e sono disposti ad acquistare add-on per magazzini o produzione."
  pros:
    - "Il nucleo gratuito include ordini d'acquisto, fornitori, merce in arrivo e log di magazzino."
    - "Stock Central mostra tutti i prodotti, gli SKU, i prezzi d'acquisto e le giacenze in un'unica schermata."
    - "Widget della dashboard per vendite, vendite perse, controllo delle giacenze e valore attuale delle giacenze."
    - "API REST documentata e comandi WP-CLI nel plugin gratuito."
    - "Capability dettagliate per ordini d'acquisto, log di magazzino e fornitori."
    - "Gli add-on coprono multi-magazzino, distinte base, inventari fisici e prelievo e imballaggio."
  cons:
    - "Richiede WooCommerce; gestisce solo prodotti WooCommerce."
    - "Le giacenze separate per magazzino richiedono l'add-on a pagamento Multi-Inventory."
    - "Esportazione e importazione CSV richiedono l'add-on a pagamento Export PRO; il plugin gratuito esporta in PDF."
    - "Uno storico completo delle modifiche richiede l'add-on a pagamento Action Logs."
    - "Gli add-on hanno ciascuno un prezzo annuale, quindi più add-on fanno salire presto la spesa."
    - "La politica di rimborso del produttore non prevede una garanzia generale di rimborso."
  notes:
    items.types: "L'add-on Product Levels aggiunge Raw Material, Product Part e le relative versioni variabili come tipi di prodotto WooCommerce."
    items.sku_barcode: "Gli SKU sono il campo di WooCommerce, e il plugin gratuito aggiunge un campo per il codice a barre a prodotti e variazioni."
    items.serials: "Multi-Inventory registra numeri di lotto e date di scadenza per inventario, non numeri di serie per unità."
    locations.multiple: "Il plugin gratuito si limita ad assegnare ai prodotti termini di sede; le quantità separate per sede richiedono Multi-Inventory."
    movements.receive_issue: "I log di magazzino aumentano o riducono le giacenze, e gli ordini d'acquisto caricano la merce quando viene ricevuta."
    movements.adjustments: "I tipi di log di magazzino includono Reserved Stock, Customer Returns, Warehouse Damage, Lost in Post e Other."
    movements.purchase_orders: "Gli ordini d'acquisto gratuiti caricano la merce al ricevimento; Purchase Orders PRO aggiunge consegne, fatture e altro."
    movements.sales_orders: "La giacenza viene ridotta dai normali ordini WooCommerce."
    ledger.history: "L'add-on Action Logs registra ogni modifica con utente, origine e ora; il plugin gratuito tiene solo i log di magazzino e le note degli ordini."
    valuation.cost: "Il plugin gratuito salva i prezzi d'acquisto e su questi basa un widget della dashboard Current Stock Value."
    valuation.fifo_lifo: "Multi-Inventory può vendere dagli inventari in ordine FIFO, LIFO o di scadenza, ma è un ordine di vendita, non una valorizzazione al costo FIFO o LIFO."
    alerts.email: "Il plugin si affida alle email di scorta bassa ed esaurimento integrate in WooCommerce e in alcuni casi può trattenerle."
    reports.reports: "I report sono le statistiche della dashboard e un'esportazione PDF di Stock Central."
    data.csv_import: "Export PRO è descritto come strumento di esportazione e importazione; i dettagli dell'importazione non sono stati verificati a fondo."
    data.csv_export: "Export PRO esporta in CSV, XML o JSON, a mano o in modo pianificato; il plugin gratuito esporta solo in PDF."
    data.wp_cli: "Il plugin gratuito registra un comando \"wp atum\" che esegue gli strumenti di ATUM."
    access.roles: "Il plugin aggiunge capability proprie, come atum_edit_purchase_price e atum_read_inbound_stock, invece di ruoli propri."
    access.permissions: "Le capability distinguono tra ordini d'acquisto, log e fornitori propri e quelli di altri utenti, ma il plugin gratuito non ha regole di accesso per sede."
    extras.frontend: "Multi-Inventory può limitare gli inventari per regione, così i clienti vedono giacenze e prezzi della loro zona; non abbiamo confermato altre visualizzazioni sul front-end."
    extras.scanner: "Barcodes PRO permette di cercare nelle tabelle di ATUM per codice a barre letto e supporta formati 1D e 2D."
    extras.woocommerce: "ATUM è un'estensione di WooCommerce e richiede WooCommerce."
  texts:
    extras.storage: "Prodotti WooCommerce e relativi meta, più tabelle proprie di ATUM (atum_product_data, atum_order_items, atum_order_itemmeta) per dati di giacenza, ordini d'acquisto e log di magazzino."

wp-erp:
  summary: "WP ERP è una suite gratuita per WordPress per gestione del personale, CRM e contabilità. Il modulo di contabilità gratuito ha prodotti e ordini d'acquisto, ma la gestione delle giacenze arriva con l'estensione Inventory, inclusa nel piano a pagamento Scale."
  award: "Il migliore per personale e contabilità insieme"
  best_for: "Piccole aziende che gestiscono già personale, CRM o contabilità in WP ERP e hanno bisogno di semplici conteggi delle giacenze legati ad acquisti e vendite."
  pros:
    - "Nucleo gratuito con moduli per personale, CRM e contabilità e nessun limite di utenti."
    - "La merce viene caricata dagli acquisti e scaricata dalle vendite, quindi le quantità seguono le transazioni reali."
    - "Report su acquisti di prodotti, vendite di prodotti e magazzino nel modulo di contabilità."
    - "Nella versione gratuita i prodotti si possono importare da CSV ed esportare in CSV."
    - "I prodotti sono classificati come articoli di magazzino o servizi."
    - "Sviluppo attivo, con un aggiornamento a ottobre 2026."
  cons:
    - "La gestione delle giacenze richiede il piano Scale a 474 USD l'anno, con prezzo in base al numero di utenti."
    - "Magazzini, trasferimenti e rettifiche di magazzino non sono documentati."
    - "Avvisi di scorta bassa, codici a barre, numeri di serie e unità di misura non sono documentati."
    - "Il metodo di valorizzazione non è documentato."
    - "Il produttore dice che la sincronizzazione delle giacenze con WooCommerce è ancora in lavorazione."
    - "Il periodo di rimborso è di 14 giorni."
  notes:
    items.types: "Il modulo di contabilità gratuito ha due tipi di prodotto, Inventory e Service."
    items.sku_barcode: "La schermata Inventory mostra un codice articolo; non è documentato un campo per il codice a barre."
    movements.receive_issue: "Gli acquisti caricano la merce e le vendite la scaricano, con registrazione per transazione."
    movements.checkout: "L'estensione separata Asset Manager assegna i beni aziendali ai dipendenti, ma non è collegata alle giacenze."
    movements.purchase_orders: "Gli ordini d'acquisto sono nel modulo di contabilità gratuito; la merce viene caricata solo con l'estensione Inventory."
    ledger.history: "Carichi e scarichi sono salvati per transazione nel database; non è documentata una schermata con lo storico per articolo."
    reports.reports: "Sono disponibili report su acquisti di prodotti, vendite di prodotti e magazzino, e la maggior parte dei report si esporta in CSV."
    data.csv_import: "Importa da CSV l'elenco dei prodotti, non le quantità a magazzino."
    data.csv_export: "Esporta in CSV l'elenco dei prodotti."
    data.rest_api: "Il plugin ha rotte REST per prodotti e categorie, ma non abbiamo trovato una documentazione pubblica dell'API."
    data.wp_cli: "Esistono comandi WP-CLI per moduli, personale e CRM, ma nessuno per prodotti o giacenze."
    access.roles: "Solo il ruolo Accounting Manager può usare i menu Inventory; non esiste un ruolo dedicato solo al magazzino."
    extras.woocommerce: "L'integrazione con WooCommerce del piano Growth sincronizza gli ordini nella contabilità, non le giacenze."
  texts:
    extras.storage: "Tabelle personalizzate con prefisso erp_acct_ nel database WordPress, sul tuo server."

wp-inventory-manager:
  summary: "WP Inventory Manager è un plugin di lunga data per cataloghi e conteggio delle giacenze che salva gli articoli in tabelle proprie e li elenca sul front-end con uno shortcode. Il nucleo gratuito copre articoli illimitati, immagini, categorie e una sola quantità per articolo; sedi, tipi di articolo, campi personalizzati, CSV, un registro di magazzino e statistiche sono add-on a pagamento che richiedono una licenza Pro o All Access."
  award: "Il migliore per cataloghi pubblici di articoli"
  best_for: "Sceglilo se vuoi soprattutto mostrare attrezzature, ricambi o collezioni sul tuo sito e tenere un semplice conteggio delle quantità, e sei disposto ad acquistare add-on per avere di più."
  pros:
    - "Il nucleo gratuito non ha limiti di articoli e non richiede WooCommerce."
    - "Elenco sul front-end con ricerca e ordinamento tramite lo shortcode [wpinventory]."
    - "Foto degli articoli, soglia di scorta bassa e una piccola dashboard di stato nella versione gratuita."
    - "Ampia gamma di add-on: sedi, tipi di articolo, importazione/esportazione CSV, registro, statistiche, codici QR."
    - "Mantenuto attivamente (2.5.9, aggiornato a ottobre 2026) con garanzia di rimborso di 30 giorni."
  cons:
    - "La versione gratuita registra un solo numero di quantità per articolo; non ci sono movimenti di magazzino."
    - "La maggior parte delle funzioni di magazzino sono add-on annuali separati ($24.99–$79.99 ciascuno) in aggiunta a una licenza Pro."
    - "Le voci del registro si possono modificare o eliminare, quindi lo storico non è a prova di audit."
    - "Niente ordini d'acquisto, valorizzazione delle giacenze documentata o trasferimenti registrati tra sedi."
    - "Niente API REST né comandi WP-CLI nel codice del plugin."
  notes:
    items.sku_barcode: "Ogni articolo ha un campo per il codice articolo; non c'è un campo dedicato al codice a barre."
    items.serials: "Un campo per il numero di serie per ogni scheda articolo, non per unità."
    items.custom_fields: "La versione gratuita permette solo di rinominare i suoi campi fissi; i campi nuovi richiedono l'add-on."
    movements.receive_issue: "Il Ledger registra aumenti e diminuzioni da prenotazioni o inserimenti manuali; la versione gratuita modifica solo la quantità."
    movements.adjustments: "Le voci manuali del Ledger possono cambiare la quantità, ma non c'è un campo dedicato alla causale."
    movements.sales_orders: "Il Ledger può generare fatture ai clienti dalle voci; non è descritto un flusso completo di ordini di vendita."
    ledger.history: "Il Ledger registra prenotazioni e voci manuali; anche Locations Manager registra le modifiche alle quantità."
    ledger.locked: "La documentazione del Ledger dice che ogni voce si può modificare o eliminare."
    alerts.low_stock: "Una soglia globale di quantità bassa evidenzia gli articoli nell'amministrazione e li conta nella dashboard."
    alerts.email: "L'email gratuita di quantità bassa viene inviata solo dopo una prenotazione dal front-end; l'add-on Notifications copre avvisi più ampi."
    reports.dashboard: "La versione gratuita mostra riquadri con i conteggi; grafici e suddivisioni arrivano con l'add-on Analytics."
    reports.reports: "Analytics copre riepiloghi per categoria, stato, sede, scorte basse e prenotazioni, ma nessun report di valorizzazione o dei movimenti."
    access.roles: "Un'impostazione sceglie il ruolo WordPress minimo che può aggiungere o modificare articoli; non ci sono ruoli di magazzino."
    access.permissions: "Puoi limitare i non amministratori alla modifica dei soli articoli propri; regole per singolo utente richiedono Advanced User Control."
    extras.frontend: "Lo shortcode [wpinventory] mostra in qualsiasi pagina un elenco di articoli ricercabile e ordinabile."
    extras.scanner: "Genera codici QR che aprono l'articolo nell'amministrazione dalla fotocamera di un telefono; non movimenta la merce."
    extras.woocommerce: "Il plugin funziona in modo indipendente e non ha integrazione con WooCommerce."
  texts:
    extras.storage: "Tabelle di database proprie (wpinventory_item, category, image, status e altre)."

stock-locations-for-woocommerce:
  summary: "Stock Locations for WooCommerce divide la giacenza di un prodotto tra più sedi, come negozi o magazzini, e scala la sede giusta quando arrivano gli ordini. La versione gratuita copre sedi, assegnazione degli ordini, accesso REST e shortcode per il front-end, mentre una versione premium aggiunge mappe, archivi delle sedi e alcune opzioni di visualizzazione."
  award: "Le migliori giacenze per sede gratuite per WooCommerce"
  best_for: "Negozi WooCommerce con più punti vendita o magazzini che hanno bisogno delle giacenze per sede e vogliono che i clienti vedano o scelgano una sede."
  pros:
    - "Giacenze per sede gratuite per prodotti semplici e variabili."
    - "Gli ordini vengono assegnati alle sedi in automatico o dal cliente."
    - "Gli shortcode mostrano le giacenze per sede nelle pagine prodotto e nel carrello."
    - "Prezzi per sede e notifiche email per sede."
    - "API REST ed endpoint cron per aggiornare le giacenze per sede."
    - "Campi per codici a barre ISBN, UPC, EAN e ASIN sui prodotti."
  cons:
    - "Richiede WooCommerce; estende solo prodotti WooCommerce."
    - "Niente trasferimenti di magazzino, ordini d'acquisto o registrazioni delle rettifiche."
    - "Niente valorizzazione delle giacenze né avvisi di scorta bassa per sede."
    - "Importazione ed esportazione CSV richiedono un add-on separato a pagamento."
    - "Piccolo team di sviluppo e circa 900 installazioni attive."
    - "La politica di rimborso copre solo le funzioni che non funzionano come descritto."
  notes:
    items.sku_barcode: "Gli SKU sono il campo di WooCommerce, e il plugin aggiunge una scheda Barcodes con i campi ISBN, UPC, EAN e ASIN."
    items.images: "I prodotti usano le immagini di WooCommerce; il plugin non aggiunge una gestione delle immagini propria."
    locations.multiple: "Le sedi sono una tassonomia dei prodotti, e la giacenza per sede è salvata come meta del prodotto."
    movements.receive_issue: "La giacenza per sede si cambia modificando il numero sul prodotto o tramite l'API, non con documenti di carico."
    movements.sales_orders: "Gli ordini WooCommerce scalano la giacenza nella sede assegnata, e gli ordini annullati possono ripristinarla."
    ledger.history: "Le riduzioni per sede vengono scritte come note dell'ordine WooCommerce e in un log di debug facoltativo, ma non c'è una schermata con lo storico per articolo."
    alerts.low_stock: "Il plugin non ha livelli di scorta bassa per sede; la soglia di WooCommerce resta valida sulla giacenza totale."
    alerts.email: "Le email vengono inviate quando la merce viene assegnata a una sede e per i nuovi ordini, non per le scorte basse."
    data.csv_import: "L'importazione CSV è in un add-on separato Import/Export, indicato nel plugin a €29."
    data.csv_export: "L'esportazione CSV è nello stesso add-on separato Import/Export, indicato a €29."
    data.rest_api: "Il readme documenta GET e PUT sugli endpoint dei prodotti WooCommerce e un endpoint per le sedi, più un'API JSON basata su chiave."
    access.roles: "La gestione delle sedi usa la capability manage_woocommerce di WooCommerce; non ci sono ruoli specifici del plugin."
    extras.frontend: "Gli shortcode mostrano le giacenze per sede nelle pagine prodotto e nel carrello, e i clienti possono scegliere una sede; mappe e archivi delle sedi sono premium."
    extras.woocommerce: "Il plugin è un'estensione di WooCommerce e richiede WooCommerce 3.4 o successivo."
  texts:
    extras.storage: "Meta dei prodotti WooCommerce (chiavi _stock_at_<location>) più una tassonomia \"location\" per le sedi; nessuna tabella personalizzata."

zintory:
  summary: "Zintory è un plugin di magazzino basato sulle transazioni, in cui la merce si sposta tra conti configurabili come magazzini, fornitori e clienti. La versione gratuita copre articoli, conti, tipi di transazione e giacenze per sede; una licenza Pro una tantum aggiunge la duplicazione delle transazioni, statistiche per articolo e lo storico delle modifiche."
  award: "Il migliore per una gestione semplice delle giacenze basata sulle transazioni"
  best_for: "Sceglilo se vuoi che le giacenze cambino solo tramite acquisti, vendite e spostamenti tra sedi registrati, e non ti servono foto degli articoli, campi personalizzati o avvisi."
  status: "Base di utenti piccola (30+ installazioni attive); la versione 4 è una riscrittura del plugin precedente, ultimo aggiornamento a luglio 2026."
  pros:
    - "Le variazioni di giacenza sono registrate come transazioni, non modificando un numero."
    - "Le quantità sono tenute per magazzino o sede nella versione gratuita."
    - "Tipi di conto e tipi di transazione configurabili si adattano ad acquisti, vendite, trasferimenti o noleggi."
    - "Stati di bozza, confermato e completato prima che la giacenza venga toccata."
    - "Pro è un pagamento unico di $59 con aggiornamenti a vita."
    - "Possibilità di usare i prodotti WooCommerce come elenco degli articoli."
  cons:
    - "Gli articoli hanno solo titolo, SKU e descrizione: niente immagini, campi personalizzati, unità o numeri di serie."
    - "Niente livelli di scorta minima, avvisi email o dashboard."
    - "Le transazioni completate si possono ancora eliminare, quindi lo storico non è bloccato."
    - "Niente importazione CSV, visualizzazione sul front-end o lettura dei codici a barre nel codice gratuito."
    - "Base di installazioni molto piccola e documentazione scarsa."
  notes:
    items.types: "I tipi di conto e di transazione sono configurabili, ma gli articoli in sé non hanno tipi."
    items.sku_barcode: "Gli articoli hanno un campo SKU; non c'è un campo per il codice a barre."
    locations.multiple: "I tipi di conto impostati per tenere la quantità (come Warehouse) hanno ciascuno un proprio saldo di giacenza."
    locations.transfers: "Per registrare uno spostamento si configura un tipo di transazione tra due conti di magazzino."
    movements.receive_issue: "La giacenza è calcolata dalle transazioni completate tra conti."
    movements.checkout: "I prestiti si possono rappresentare con conti e tipi di transazione personalizzati, ma non ci sono scadenze né strumenti di restituzione."
    movements.adjustments: "I tipi di transazione a una sola parte possono rettificare una sede; la descrizione della transazione è l'unico posto per una causale."
    movements.purchase_orders: "Un tipo Purchase predefinito sposta la merce da un fornitore a un magazzino con numerazione PO- e prezzi."
    movements.sales_orders: "Un tipo Sale predefinito con numerazione SO- riduce la giacenza; non ci sono fatture."
    ledger.history: "Ogni articolo ha un elenco delle transazioni in cui compare; la versione Pro aggiunge uno storico completo delle modifiche."
    ledger.locked: "Le transazioni in qualsiasi stato, anche completate, si possono eliminare dall'amministrazione."
    alerts.low_stock: "La scheda del plugin parla di reagire alle scorte basse, ma il codice non ha un livello di riordino né un avviso."
    reports.reports: "Pro aggiunge statistiche per articolo (venduto, acquistato, spostato e prezzo medio); non ci sono report più ampi."
    access.roles: "Gli amministratori WordPress hanno accesso, e puoi aggiungere altri utenti WordPress come amministratori del plugin."
    extras.woocommerce: "Un'impostazione carica l'elenco degli articoli dai prodotti WooCommerce; non sincronizza indietro i livelli di giacenza."
  texts:
    extras.storage: "Tabelle di database proprie (articoli, conti, transazioni e righe delle transazioni)."

bizuno:
  summary: "Bizuno è un ERP open source gratuito con contabilità in partita doppia che funziona dentro WordPress. Il suo modulo di magazzino è incluso senza costi e copre più punti vendita, numeri di serie, assemblaggi e costo FIFO, LIFO o medio."
  award: "Il miglior magazzino ERP completo gratuito"
  best_for: "Aziende che vogliono una contabilità completa con le giacenze legate ai conti, senza costi di licenza, e sanno gestire un sistema più complesso."
  status: "Base di installazioni piccola (circa 20 installazioni attive). Ultimo aggiornamento a giugno 2026, testato fino a WordPress 6.9."
  pros:
    - "Gratuito e open source (AGPL), senza livelli a pagamento né costi per utente."
    - "Giacenze per punto vendita, con trasferimenti tra punti vendita e rettifiche registrati."
    - "Costo FIFO, LIFO o medio per articolo, con gli strati di costo nello storico."
    - "Articoli con numero di serie, assemblaggi e varianti di articolo da articoli master."
    - "Molti report di magazzino, tra cui valorizzazione, movimenti e un prospetto di riordino."
    - "Importazione ed esportazione CSV degli articoli, campi personalizzati inclusi."
  cons:
    - "Base di utenti molto piccola e poche recensioni."
    - "Le registrazioni contabilizzate possono essere eliminate dagli utenti con diritti di eliminazione."
    - "Funziona come app a sé con un accesso separato, non come normali schermate di WordPress."
    - "Il plugin connettore per WooCommerce è stato chiuso su WordPress.org a ottobre 2025."
    - "Nessuna email di scorta bassa né lettura dei codici a barre documentate."
    - "La documentazione dell'API REST non elenca endpoint per il magazzino."
  notes:
    items.sku_barcode: "Ogni articolo ha uno SKU e un campo per il codice UPC."
    items.units: "Ogni articolo ha un'unità di acquisto e un'unità di vendita, con una quantità che converte dall'una all'altra."
    movements.adjustments: "Le rettifiche hanno una descrizione libera per riga invece di un elenco fisso di causali."
    ledger.locked: "Gli utenti con diritti di eliminazione possono eliminare le registrazioni contabilizzate; un'opzione per utente limita le modifiche al periodo corrente."
    alerts.low_stock: "Gli articoli hanno quantità minime e di riordino, e un report con il prospetto di riordino elenca che cosa acquistare."
    reports.reports: "Include report di valorizzazione, movimenti, anzianità, storico per SKU, trasferimenti e riordino."
    data.rest_api: "È documentata un'API REST, ma i moduli elencati coprono ordini, spedizioni, pagamenti e importazione o esportazione, non direttamente il magazzino."
    access.roles: "I ruoli impostano livelli di sicurezza per area, compreso un livello separato per il magazzino."
    access.permissions: "Gli utenti possono essere limitati a un solo punto vendita, ai propri record o al periodo corrente."
    extras.frontend: "L'intera app funziona in una pagina /bizuno del front-end con un proprio accesso."
    extras.woocommerce: "Bizuno invia prodotti, giacenze e prezzi a WooCommerce, ma il negozio ha bisogno del plugin bizuno-api, che non è più su WordPress.org."
  texts:
    extras.storage: "Tabelle personalizzate con prefisso bizuno_ nel database WordPress, e file nella cartella uploads/bizuno."
